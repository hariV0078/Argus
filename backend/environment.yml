name: recon
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip=24.*

  # Photogrammetry core (conda-forge ships GPU-enabled COLMAP)
  - colmap

  # Scientific stack
  - numpy
  - pandas
  - scipy
  - matplotlib

  # Geospatial
  - pyproj
  - gdal
  - rasterio

  # Utilities
  - exifread
  - tqdm
  - pyyaml
  - opencv

  # PyTorch installed separately via pip (cu128 wheels) — see setup.sh step 3b
  # RTX 5070 = Blackwell SM_120; requires CUDA 12.8 + PyTorch >= 2.6

  - pip:
    # Detection + segmentation
    - ultralytics              # YOLOv8-seg

    # SAM2 (Meta) — dynamic object masking
    - git+https://github.com/facebookresearch/sam2.git

    # 3D processing
    - open3d>=0.18

    # GPS/IMU fusion utilities
    - pymap3d
    - transforms3d

    # Export formats
    - trimesh[all]
    - laspy[lazrs]

    # Pipeline orchestration
    - fastapi
    - uvicorn[standard]
    - python-multipart

    # Web viewer backend
    - websockets

    # Public tunnel for the mobile app (reads backend/.env — see .env.example)
    - pyngrok
    - python-dotenv

    # Optional: Gaussian Splatting (comment out if no time)
    # - nerfstudio
